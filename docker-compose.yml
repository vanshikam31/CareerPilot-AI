services:
  db:
    image: pgvector/pgvector:pg16
    container_name: careerpilot-db
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot
      POSTGRES_DB: careerpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: careerpilot-api
    profiles: ["full"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://careerpilot:careerpilot@db:5432/careerpilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: